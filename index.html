<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vuducvinh Premium Shop</title>
    <style>
        :root { --pink-main: #ffafbd; --pink-dark: #ff85a1; --pink-light: #ffeef2; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--pink-light); font-family: 'Segoe UI', sans-serif; }
        .shop-box { width: 350px; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); border-radius: 40px; padding: 25px; border: 3px solid #fff; box-shadow: 0 15px 35px rgba(255,175,189,0.4); text-align: center; }
        .auth-container, .shop-content { display: none; }
        .active { display: block !important; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 20px; border: 2px solid var(--pink-main); box-sizing: border-box; outline: none; }
        .btn-main { width: 100%; background: var(--pink-dark); color: white; border: none; padding: 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .nav-bubbles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .nav-bubbles div { background: white; padding: 10px; border-radius: 50%; font-size: 9px; font-weight: bold; cursor: pointer; color: var(--pink-dark); }
        .item-card { background: white; margin-bottom: 8px; padding: 12px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; border: 1px solid var(--pink-light); }
        #topup-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; justify-content:center; align-items:center; }
    </style>
</head>
<body>

<div class="shop-box">
    <div id="auth-ui" class="auth-container active">
        <h2 id="auth-title" style="color:var(--pink-dark)">ĐĂNG NHẬP</h2>
        <input type="text" id="username" placeholder="Tên đăng nhập tự chọn">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button class="btn-main" onclick="handleAuth()">XÁC NHẬN</button>
        <p onclick="toggleMode()" style="font-size:12px; cursor:pointer; color:gray; margin-top:15px;">Chuyển Đăng ký / Đăng nhập</p>
    </div>

    <div id="shop-ui" class="shop-content">
        <h2 style="color:var(--pink-dark)">VUDUCVINH SHOP</h2>
        <p>Chào: <b id="display-name"></b> | Số dư: <b id="user-balance" style="color:var(--pink-dark)">0</b> VNĐ</p>
        <div class="nav-bubbles">
            <div onclick="showTopup()">💰<br>NẠP</div>
            <div onclick="window.open('https://www.facebook.com/share/1JQ4zTuqN9/?mibextid=wwXIfr', '_blank')">📜<br>LỊCH SỬ</div>
            <div onclick="location.hash='#proxy'">🌐<br>PROXY</div>
            <div onclick="location.hash='#cert'">📜<br>CERT</div>
        </div>
        <div id="product-list"></div>
        <p onclick="logout()" style="font-size:11px; color:#bbb; cursor:pointer; margin-top:20px;">Đăng xuất</p>
    </div>
</div>

<div id="topup-modal">
    <div class="shop-box" style="background:white;">
        <h3 style="color:var(--pink-dark)">NẠP TIỀN QUA MBBANK</h3>
        <input type="number" id="amount" placeholder="Nhập số tiền">
        <button class="btn-main" onclick="createTopup()">TẠO MÃ QR</button>
        <div id="qr-area" style="display:none; margin-top:15px;">
            <img id="qr-img" src="" style="width:100%; border-radius:15px;">
            <p style="font-size:13px;">Nội dung: <b id="qr-memo" style="color:red; font-size:16px;"></b></p>
        </div>
        <button onclick="closeTopup()" style="background:none; border:none; margin-top:15px; color:gray; cursor:pointer;">Đóng</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAouaVk0KLy5RY-GkReh3MhPDwwFkylfes",
        authDomain: "vuducvinh-48969.firebaseapp.com",
        projectId: "vuducvinh-48969",
        storageBucket: "vuducvinh-48969.firebasestorage.app",
        messagingSenderId: "271942238181",
        appId: "1:271942238181:web:74e78bbf76b9ac442b790c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentUser = null;

    window.toggleMode = () => {
        const title = document.getElementById('auth-title');
        title.innerText = (title.innerText === "ĐĂNG NHẬP") ? "ĐĂNG KÝ" : "ĐĂNG NHẬP";
    };

    window.handleAuth = async () => {
        const user = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('password').value;
        if(!user || !pass) return alert("Nhập đủ tên và mật khẩu");
        
        const isLogin = (document.getElementById('auth-title').innerText === "ĐĂNG NHẬP");
        const userRef = doc(db, "users", user);

        if (isLogin) {
            const d = await getDoc(userRef);
            if(d.exists() && d.data().password === pass) {
                loginSuccess(user);
            } else {
                alert("Sai tên đăng nhập hoặc mật khẩu");
            }
        } else {
            const d = await getDoc(userRef);
            if(d.exists()) return alert("Tên này đã có người dùng");
            await setDoc(userRef, { username: user, password: pass, balance: 0 });
            alert("Đăng ký thành công! Hãy đăng nhập.");
            toggleMode();
        }
    };

    function loginSuccess(id) {
        currentUser = id;
        document.getElementById('auth-ui').classList.remove('active');
        document.getElementById('shop-ui').classList.add('active');
        document.getElementById('display-name').innerText = id;
        onSnapshot(doc(db, "users", id), d => {
            if(d.exists()) document.getElementById('user-balance').innerText = d.data().balance.toLocaleString();
        });
        loadProducts();
    }

    function loadProducts() {
        onSnapshot(collection(db, "products"), (snap) => {
            let html = '';
            snap.forEach(d => {
                const p = d.data();
                html += `<div class="item-card">
                    <span><b>${p.name}</b><br>${p.price.toLocaleString()}đ</span>
                    <button onclick="window.open('https://www.facebook.com/share/1JQ4zTuqN9/?mibextid=wwXIfr', '_blank')" style="background:var(--pink-dark); color:white; border:none; padding:6px 12px; border-radius:12px; font-weight:bold; cursor:pointer;">MUA</button>
                </div>`;
            });
            document.getElementById('product-list').innerHTML = html;
        });
    }

    window.showTopup = () => document.getElementById('topup-modal').style.display = 'flex';
    window.closeTopup = () => document.getElementById('topup-modal').style.display = 'none';
    
    window.createTopup = async () => {
        const amount = document.getElementById('amount').value;
        if(!amount || amount < 10000) return alert("Tối thiểu 10.000đ");
        const memo = "VINH" + Math.floor(1000 + Math.random() * 9000);
        await addDoc(collection(db, "topups"), { username: currentUser, amount: Number(amount), memo: memo, status: "pending", time: new Date() });
        document.getElementById('qr-img').src = `https://img.vietqr.io/image/mbbank-84740866778899-compact2.jpg?amount=${amount}&addInfo=${memo}&accountName=VU%20DUC%20VINH`;
        document.getElementById('qr-memo').innerText = memo;
        document.getElementById('qr-area').style.display = 'block';
    };

    window.logout = () => location.reload();
</script>
</body>
</html>
